services:
  db:
    image: postgis/postgis:16-3.4
    container_name: byteforge-db
    environment:
      POSTGRES_USER: byteforge
      POSTGRES_PASSWORD: byteforge
      POSTGRES_DB: byteforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byteforge -d byteforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
